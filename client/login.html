<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjFlow - Вхід</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-600 to-pink-500 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-10">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-indigo-600">ProjFlow</h1>
      <p class="text-gray-600 mt-2">Управління проєктами</p>
    </div>

    <h2 class="text-2xl font-semibold text-center mb-8">Вхід в акаунт</h2>

    <div class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input id="email" type="email" placeholder="your@email.com"
               class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
        <input id="password" type="password" placeholder="••••••••"
               class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500 transition">
      </div>

      <button onclick="login()" 
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-2xl transition">
        Увійти
      </button>

      <div class="text-center">
        <a href="register.html" class="text-indigo-600 hover:underline">
          Немає акаунту? Зареєструватися
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
