<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjFlow - Мої проєкти</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-7xl mx-auto p-8">
    
    <!-- Шапка -->
    <div class="flex items-center justify-between mb-10">
      <div class="flex items-center gap-8">
        <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
          <div class="w-9 h-9 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-xl">P</div>
          <span class="text-2xl font-bold text-gray-800">ProjFlow</span>
        </a>
        
        <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-indigo-600 font-medium transition">
          <i class="fas fa-home"></i>
          <span>Головна сторінка</span>
        </a>
      </div>

      <div class="flex items-center gap-6">
        <a href="profile.html" class="flex items-center gap-2 text-gray-700 hover:text-indigo-600 font-medium transition">
          <i class="fas fa-user-circle text-xl"></i>
          <span>Профіль</span>
        </a>

        <button onclick="logout()" 
                class="flex items-center gap-2 px-5 py-2.5 text-red-600 hover:bg-red-50 rounded-2xl font-medium transition">
          <i class="fas fa-sign-out-alt"></i>
          <span>Вийти</span>
        </button>
      </div>
    </div>

    <!-- Привітання -->
    <div class="mb-10">
      <h1 class="text-4xl font-bold text-gray-800">Доброго дня, <span id="greeting-name" class="text-indigo-600"></span>!</h1>
      <p class="text-gray-600 mt-1">Ось як просуваються твої проєкти</p>
    </div>

    <!-- Статистика -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
      <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-500 text-sm">Створено проєктів</p>
            <p id="stat-projects" class="text-5xl font-bold text-gray-800 mt-3">0</p>
          </div>
          <i class="fas fa-folder text-6xl text-indigo-100"></i>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-500 text-sm">Усього створено задач у всіх проєктах</p>
            <p id="stat-tasks" class="text-5xl font-bold text-gray-800 mt-3">0</p>
          </div>
          <i class="fas fa-tasks text-6xl text-amber-100"></i>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-gray-500 text-sm">Виконано задач у всіх проєктах</p>
            <p id="stat-done" class="text-5xl font-bold text-emerald-600 mt-3">0</p>
          </div>
          <i class="fas fa-check-circle text-6xl text-emerald-100"></i>
        </div>
      </div>
    </div>

    <!-- Мої проєкти -->
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-3xl font-semibold text-gray-800">Мої проєкти</h2>
      <button onclick="createNewProject()" 
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl flex items-center gap-3 font-medium transition">
        <i class="fas fa-plus"></i>
        Створити новий проєкт
      </button>
    </div>

    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <!-- Модальне вікно редагування проєкту -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8">
      <h2 class="text-2xl font-semibold mb-6">Редагувати проєкт</h2>
      
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Назва проєкту</label>
          <input id="edit-name" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Опис</label>
          <textarea id="edit-description" rows="4" class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500"></textarea>
        </div>
      </div>

      <div class="flex gap-3 mt-8">
        <button onclick="hideEditModal()" class="flex-1 py-3 border border-gray-300 rounded-2xl font-medium hover:bg-gray-50 transition">
          Скасувати
        </button>
        <button onclick="saveProjectEdit()" class="flex-1 py-3 bg-indigo-600 text-white rounded-2xl font-medium hover:bg-indigo-700 transition">
          Зберегти зміни
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
