<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjFlow - Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="bg-white rounded-3xl shadow-sm p-6 mb-8 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button onclick="goBack()" class="flex items-center gap-2 text-gray-600 hover:text-indigo-600 font-medium transition">
          <i class="fas fa-arrow-left text-xl"></i>
          <span>Назад до проектів</span>
        </button>
        <h1 id="project-title" class="text-3xl font-bold text-gray-800">Назва проєкту</h1>
      </div>

      <button onclick="showAddTaskModal()"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2 font-medium transition">
        <i class="fas fa-plus"></i>
        Додати задачу
      </button>
    </div>

    <!-- Пошук та фільтри -->
    <div class="bg-white rounded-3xl shadow-sm p-6 mb-8 flex flex-wrap gap-4 items-center">
      <div class="flex-1 min-w-[280px]">
        <div class="relative">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input id="search-input"
                 type="text"
                 placeholder="Пошук по назві або опису..."
                 onkeyup="applyFilters()"
                 class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div>
        <select id="priority-filter" onchange="applyFilters()"
                class="px-5 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500">
          <option value="">Всі пріоритети</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <div>
        <select id="status-filter" onchange="applyFilters()"
                class="px-5 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500">
          <option value="">Всі статуси</option>
          <option value="todo">To Do</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>

      <button onclick="resetFilters()"
              class="px-6 py-3 text-gray-600 hover:bg-gray-100 rounded-2xl font-medium transition flex items-center gap-2">
        <i class="fas fa-undo"></i>
        Скинути
      </button>
    </div>

    <!-- Kanban Columns -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- To Do -->
      <div id="column-todo"
           ondrop="drop(event)"
           ondragover="allowDrop(event)"
           class="column bg-white rounded-3xl p-6 shadow-sm border-t-4 border-blue-500 hover:shadow-md transition min-h-[500px]">
        <div onclick="selectColumn('todo')" class="flex items-center justify-between mb-6 cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-4 h-4 bg-blue-500 rounded-full"></div>
            <h3 class="font-semibold text-xl text-blue-700">To Do</h3>
          </div>
          <span id="todo-count" class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-sm font-medium">0</span>
        </div>
        <div id="todo" class="space-y-4 min-h-[400px]"></div>
      </div>

      <!-- In Progress -->
      <div id="column-in_progress"
           ondrop="drop(event)"
           ondragover="allowDrop(event)"
           class="column bg-white rounded-3xl p-6 shadow-sm border-t-4 border-amber-500 hover:shadow-md transition min-h-[500px]">
        <div onclick="selectColumn('in_progress')" class="flex items-center justify-between mb-6 cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-4 h-4 bg-amber-500 rounded-full"></div>
            <h3 class="font-semibold text-xl text-amber-700">In Progress</h3>
          </div>
          <span id="in_progress-count" class="bg-amber-100 text-amber-700 px-4 py-1 rounded-full text-sm font-medium">0</span>
        </div>
        <div id="in_progress" class="space-y-4 min-h-[400px]"></div>
      </div>

      <!-- Done -->
      <div id="column-done"
           ondrop="drop(event)"
           ondragover="allowDrop(event)"
           class="column bg-white rounded-3xl p-6 shadow-sm border-t-4 border-green-500 hover:shadow-md transition min-h-[500px]">
        <div onclick="selectColumn('done')" class="flex items-center justify-between mb-6 cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-4 h-4 bg-green-500 rounded-full"></div>
            <h3 class="font-semibold text-xl text-green-700">Done</h3>
          </div>
          <span id="done-count" class="bg-green-100 text-green-700 px-4 py-1 rounded-full text-sm font-medium">0</span>
        </div>
        <div id="done" class="space-y-4 min-h-[400px]"></div>
      </div>
    </div>
  </div>

  <!-- Модальне вікно задачі -->
  <div id="task-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8">
      <h2 id="modal-title" class="text-2xl font-semibold mb-6">Додати нову задачу</h2>
      
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Назва задачі *</label>
          <input id="task-title" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Опис</label>
          <textarea id="task-description" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Пріоритет</label>
            <select id="task-priority" class="w-full px-4 py-3 border border-gray-300 rounded-2xl">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Дедлайн</label>
            <input id="task-deadline" type="date" class="w-full px-4 py-3 border border-gray-300 rounded-2xl">
          </div>
        </div>
      </div>

      <div class="flex gap-3 mt-8">
        <button onclick="hideTaskModal()" class="flex-1 py-3 border border-gray-300 rounded-2xl font-medium hover:bg-gray-50 transition">
          Скасувати
        </button>
        <button onclick="saveTask()" id="save-task-btn"
                class="flex-1 py-3 bg-indigo-600 text-white rounded-2xl font-medium hover:bg-indigo-700 transition">
          Додати задачу
        </button>
      </div>
    </div>
  </div>

  <!-- Бічна панель коментарів -->
  <div id="comments-sidebar" class="hidden fixed top-0 right-0 h-full w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 overflow-y-auto">
    <div class="p-6 border-b flex items-center justify-between sticky top-0 bg-white z-10">
      <h2 class="text-xl font-semibold" id="sidebar-task-title">Коментарі</h2>
      <button onclick="closeComments()" class="text-gray-500 hover:text-gray-700 text-3xl leading-none">×</button>
    </div>

    <div class="p-6" id="comments-list">
      <!-- Коментарі завантажуються динамічно -->
    </div>

    <div class="p-6 border-t sticky bottom-0 bg-white">
      <textarea id="new-comment" rows="3" placeholder="Напишіть коментар..." 
                class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500 resize-none"></textarea>
      <button onclick="addComment()" 
              class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-medium transition">
        Опублікувати коментар
      </button>
    </div>
  </div>

  <script src="http://127.0.0.1:8080/js/api.js"></script>
  <script>
    let selectedColumn = "todo";
    let currentTaskId = null;
    let currentCommentTaskId = null;   // Для коментарів
    const projectId = new URLSearchParams(window.location.search).get("id");

    let allTasks = [];

    if (!projectId) {
      alert("ID проєкту не знайдено!");
      window.location.href = "dashboard.html";
    }

    // ====================== DRAG & DROP ======================
    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

    function drop(ev) {
      ev.preventDefault();
      const taskId = ev.dataTransfer.getData("text");
      const newStatus = ev.currentTarget.id.replace("column-", "");
      updateTaskStatus(taskId, newStatus);
    }

    async function updateTaskStatus(taskId, newStatus) {
      try {
        await apiRequest(`/tasks/${taskId}/status`, "PATCH", { status: newStatus });
        loadProject();
      } catch (error) {
        alert("Не вдалося перемістити задачу");
      }
    }

    // ====================== ВИБІР КОЛОНКИ ======================
    function selectColumn(column) {
      selectedColumn = column;
      document.querySelectorAll('.column').forEach(col => col.classList.remove('ring-2', 'ring-indigo-500'));
      document.getElementById(`column-${column}`).classList.add('ring-2', 'ring-indigo-500');
    }

    // ====================== ФІЛЬТРИ ======================
    function applyFilters() {
      const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();
      const priorityFilter = document.getElementById("priority-filter").value;
      const statusFilter = document.getElementById("status-filter").value;

      const filteredTasks = allTasks.filter(task => {
        const matchesSearch = !searchTerm ||
          task.title.toLowerCase().includes(searchTerm) ||
          (task.description && task.description.toLowerCase().includes(searchTerm));

        const matchesPriority = !priorityFilter || task.priority === priorityFilter;
        const matchesStatus = !statusFilter || task.status === statusFilter;

        return matchesSearch && matchesPriority && matchesStatus;
      });

      renderColumn("todo", filteredTasks.filter(t => t.status === "todo"));
      renderColumn("in_progress", filteredTasks.filter(t => t.status === "in_progress"));
      renderColumn("done", filteredTasks.filter(t => t.status === "done"));

      updateCounts();
    }

    function resetFilters() {
      document.getElementById("search-input").value = "";
      document.getElementById("priority-filter").value = "";
      document.getElementById("status-filter").value = "";
      applyFilters();
    }

    // ====================== МОДАЛЬНЕ ВІКНО ======================
    function showAddTaskModal() {
      currentTaskId = null;
      document.getElementById("modal-title").textContent = "Додати нову задачу";
      document.getElementById("save-task-btn").textContent = "Додати задачу";
      document.getElementById("task-title").value = "";
      document.getElementById("task-description").value = "";
      document.getElementById("task-priority").value = "Medium";
      document.getElementById("task-deadline").value = "";
      document.getElementById("task-modal").classList.remove("hidden");
    }

    function hideTaskModal() {
      document.getElementById("task-modal").classList.add("hidden");
    }

    async function saveTask() {
      const title = document.getElementById("task-title").value.trim();
      const description = document.getElementById("task-description").value.trim();
      const priority = document.getElementById("task-priority").value;
      const deadline = document.getElementById("task-deadline").value || null;

      if (!title) {
        alert("Назва задачі обов'язкова");
        return;
      }

      try {
        if (currentTaskId) {
          await apiRequest(`/tasks/${currentTaskId}`, "PUT", { title, description, priority, deadline });
          alert("✅ Задача оновлена!");
        } else {
          await apiRequest("/tasks", "POST", {
            title, description, status: selectedColumn, priority, deadline, project_id: parseInt(projectId)
          });
          alert("✅ Задача додана!");
        }
        hideTaskModal();
        loadProject();
      } catch (error) {
        alert("Не вдалося зберегти задачу");
      }
    }

    // ====================== КОМЕНТАРІ ======================
    async function openComments(taskId) {
      currentCommentTaskId = taskId;
      const sidebar = document.getElementById("comments-sidebar");
      sidebar.classList.remove("hidden");
      sidebar.style.transform = "translateX(0)";

      // Завантажуємо заголовок задачі
      try {
        const data = await apiRequest(`/tasks/project/${projectId}/kanban`);
        const all = [...(data.todo || []), ...(data.in_progress || []), ...(data.done || [])];
        const task = all.find(t => t.id === taskId);
        if (task) document.getElementById("sidebar-task-title").textContent = task.title;
      } catch (e) {}

      await loadComments(taskId);
    }

    function closeComments() {
      const sidebar = document.getElementById("comments-sidebar");
      sidebar.style.transform = "translateX(100%)";
      setTimeout(() => {
        sidebar.classList.add("hidden");
      }, 300);
      currentCommentTaskId = null;
    }

    async function loadComments(taskId) {
      try {
        const comments = await apiRequest(`/tasks/${taskId}/comments`);
        const container = document.getElementById("comments-list");
        container.innerHTML = "";

        if (comments.length === 0) {
          container.innerHTML = `<p class="text-gray-500 text-center py-12">Поки немає коментарів...</p>`;
          return;
        }

        comments.forEach(comment => {
          const div = document.createElement("div");
          div.className = "mb-6 bg-gray-50 rounded-2xl p-4";
          div.innerHTML = `
            <div class="flex items-center gap-3 mb-3">
              <div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600">
                <i class="fas fa-user"></i>
              </div>
              <div>
                <p class="font-medium text-sm">${comment.user_name || "Користувач"}</p>
                <p class="text-xs text-gray-500">${new Date(comment.created_at).toLocaleString('uk-UA')}</p>
              </div>
            </div>
            <p class="text-gray-700">${comment.text}</p>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function addComment() {
      const text = document.getElementById("new-comment").value.trim();
      if (!text || !currentCommentTaskId) return;

      try {
        await apiRequest(`/tasks/${currentCommentTaskId}/comments`, "POST", { text });
        document.getElementById("new-comment").value = "";
        await loadComments(currentCommentTaskId);
      } catch (error) {
        alert("Не вдалося додати коментар");
      }
    }

    // ====================== ЗАВАНТАЖЕННЯ ТА РЕНДЕР ======================
    async function loadProject() {
      try {
        const project = await apiRequest(`/projects/${projectId}`);
        document.getElementById("project-title").textContent = project.name || "Без назви";

        const data = await apiRequest(`/tasks/project/${projectId}/kanban`);

        allTasks = [
          ...(data.todo || []),
          ...(data.in_progress || []),
          ...(data.done || [])
        ];

        applyFilters();
      } catch (e) {
        console.error(e);
      }
    }

    function renderColumn(columnId, tasks) {
      const container = document.getElementById(columnId);
      container.innerHTML = "";

      tasks.forEach(task => {
        const colorClass = columnId === 'todo' ? 'border-blue-200 bg-blue-50' :
                          columnId === 'in_progress' ? 'border-amber-200 bg-amber-50' : 'border-green-200 bg-green-50';

        const priorityColor = task.priority === 'High' ? 'text-red-600' :
                             task.priority === 'Low' ? 'text-green-600' : 'text-amber-600';

        const div = document.createElement("div");
        div.className = `p-5 rounded-2xl shadow-sm border ${colorClass} mb-3 group relative cursor-pointer`;
        div.draggable = true;
        div.id = task.id;
        div.ondragstart = drag;
        div.onclick = (e) => {
          if (!e.target.closest('button')) openComments(task.id);
        };

        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div class="flex-1">
              <h4 class="font-medium text-gray-800">${task.title}</h4>
              ${task.description ? `<p class="text-sm text-gray-600 mt-1">${task.description}</p>` : ''}
              <div class="flex items-center gap-3 mt-3 text-xs">
                <span class="${priorityColor} font-medium">${task.priority || 'Medium'}</span>
                ${task.deadline ? `<span class="text-gray-500">• ${task.deadline}</span>` : ''}
              </div>
            </div>

            <div class="flex flex-col gap-2 opacity-0 group-hover:opacity-100 transition-all" onclick="event.stopImmediatePropagation()">
              <button onclick="editTask(${task.id}); event.stopImmediatePropagation()" 
                      class="text-amber-600 hover:text-amber-700 p-1">
                <i class="fas fa-edit"></i>
              </button>
              <button onclick="deleteTask(${task.id}); event.stopImmediatePropagation()" 
                      class="text-red-500 hover:text-red-700 p-1">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateCounts() {
      ['todo', 'in_progress', 'done'].forEach(col => {
        const count = document.getElementById(col).children.length;
        document.getElementById(col + '-count').textContent = count;
      });
    }

    async function deleteTask(taskId) {
      if (!confirm("Видалити цю задачу?")) return;
      try {
        await apiRequest(`/tasks/${taskId}`, "DELETE");
        loadProject();
      } catch (error) {
        alert("Не вдалося видалити задачу");
      }
    }

    async function editTask(taskId) {
      try {
        const data = await apiRequest(`/tasks/project/${projectId}/kanban`);
        const all = [...(data.todo || []), ...(data.in_progress || []), ...(data.done || [])];
        const task = all.find(t => t.id === taskId);
        if (!task) return;

        currentTaskId = taskId;
        document.getElementById("modal-title").textContent = "Редагувати задачу";
        document.getElementById("save-task-btn").textContent = "Зберегти зміни";

        document.getElementById("task-title").value = task.title || "";
        document.getElementById("task-description").value = task.description || "";
        document.getElementById("task-priority").value = task.priority || "Medium";
        document.getElementById("task-deadline").value = task.deadline || "";

        document.getElementById("task-modal").classList.remove("hidden");
      } catch (e) {
        console.error(e);
      }
    }

    function goBack() {
      window.location.href = "dashboard.html";
    }

    // Ініціалізація
    window.onload = () => {
      loadProject();
      selectColumn("todo");
    };
  </script>
</body>
</html>
