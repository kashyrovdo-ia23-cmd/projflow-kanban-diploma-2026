<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjFlow - Реєстрація</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-10 mx-4">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
        ProjFlow
      </h1>
      <p class="text-gray-600 mt-2">Управління проєктами та завданнями</p>
    </div>

    <h2 class="text-2xl font-semibold text-center mb-8 text-gray-800">Створення акаунту</h2>

    <div class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Повне ім'я</label>
        <input id="name" type="text" placeholder="Ім'я Прізвище"
               class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input id="email" type="email" placeholder="your@email.com"
               class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
        <input id="password" type="password" placeholder="••••••••"
               class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-indigo-500 transition">
      </div>

      <button onclick="register()" 
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-2xl transition-all duration-300 flex items-center justify-center gap-2">
        <i class="fas fa-user-plus"></i>
        Зареєструватися
      </button>

      <div class="text-center text-sm">
        <a href="login.html" class="text-indigo-600 hover:underline font-medium">
          Вже маєте акаунт? Увійти
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
